version: '3.8'

services:
  autocoder:
    build:
      context: .
      dockerfile: Dockerfile
    image: autocoder-control-plane:latest
    container_name: autocoder-control-plane
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LLM_PROVIDER=${LLM_PROVIDER:-vertex}
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-us-central1}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-1.5-pro}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3:8b-instruct}
      - EXECUTION_BACKEND=${EXECUTION_BACKEND:-docker}
      - DOCKER_WORKER_IMAGE=${DOCKER_WORKER_IMAGE:-autocoder-worker:latest}
      - DOCKER_CPU_LIMIT=${DOCKER_CPU_LIMIT:-2}
      - DOCKER_MEMORY_LIMIT=${DOCKER_MEMORY_LIMIT:-2g}
      - DOCKER_PIDS_LIMIT=${DOCKER_PIDS_LIMIT:-100}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - autocoder-data:/app/prisma
      - autocoder-projects:/app/projects
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker-image-builder:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: autocoder-worker:latest
    container_name: autocoder-worker-template
    restart: "no"
    command: ["echo", "AutoCoder worker image built successfully"]

volumes:
  autocoder-data:
    driver: local
  autocoder-projects:
    driver: local
